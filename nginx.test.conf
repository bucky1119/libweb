# =============================
# nginx.test.conf (临时无域名 / 备案前测试用)
# 说明：
# 1. 保留原生产 https 域名配置（全部注释，方便备案好后直接恢复/对比）。
# 2. 启用最简单的“单端口 + /api 前缀”测试方式，用服务器 IP 直接访问。
# 3. 如果你不想带 /api 前缀，可参考下面已注释的可选配置块。
# 4. 生产放开前请务必收紧 CORS、恢复 HTTPS、HSTS 等。
# =============================

# =============================
# 【当前启用】无域名测试配置（HTTP 80）
# 访问：
#   前端: http://<服务器IP>/
#   后端: http://<服务器IP>/api/<接口路径>
# 如果后端实际接口本身没有 /api 前缀，但你转发时仍想通过 /api 访问，则保留 rewrite 行。
# 若后端 Controller 本身就是以 /api 开头，则把 rewrite 行注释掉。
# =============================
server {
    listen 80 default_server;
    server_name _;  # 无域名情况下占位

    # 前端 Vue 静态资源由前端容器提供
    location / {
        proxy_pass http://frontend:80;  # libweb_frontend Docker 服务的 80 端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ===== 后端 API 通过 /api 前缀转发 =====
    location /api/ {
        # 如果后端真实路径不带 /api，则解开下一行，去掉前缀；如后端已有 /api 前缀则保持注释
        # rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://backend:8088;  # Spring Boot 容器端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        # WebSocket / 长连接（如果未来需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # （可选）静态健康检查
    location = /nginx-health { return 200 'ok'; add_header Content-Type text/plain; }
}


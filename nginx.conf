# nginx 反向代理配置，实现域名转发
# 放在项目根目录下，供 docker-compose 使用

server {
    listen 443 ssl;
    server_name libweb.csgone.cn;

    ssl_certificate /etc/nginx/ssl/libweb.csgone.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/libweb.csgone.cn.key;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name api.csgone.cn;

    ssl_certificate /etc/nginx/ssl/api.csgone.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/api.csgone.cn.key;

    location / {
        proxy_pass http://backend:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }
}

server {
    listen 80;
    server_name libweb.csgone.cn api.csgone.cn;

    return 301 https://$host$request_uri;
}
